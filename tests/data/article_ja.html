    <h1>秋の現地調査報告：わかったこと</h1>
    <p>今年の夏、私たちは北海道の九つの湖で水質の測定を行いました。全体として水質は良好でしたが、
       八月の猛暑の後には例年より多くのアオコが確認されました。</p>
    <p>調査は二段階で進めました。①春の基準測定、②夏の追跡測定です。研究チームの代表は
       「結果は有望ですが、もう一夏分のデータが必要です」と述べました。</p>
    <h2>今後の予定</h2>
    <p>来年は調査範囲を沿岸部にも広げる予定です。地域の皆さまには、オンラインの
       フォームから観察結果をお寄せいただくようお願いしています。</p>
