name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]   # floor + latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (base deps only, no torch)
        run: pip install -e . ruff pytest
      - name: Lint
        run: ruff check src tests
      - name: Test (model goldens skip without HTMLSIFT_BUNDLE)
        run: pytest -q
